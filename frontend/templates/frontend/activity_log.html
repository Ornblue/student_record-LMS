{% extends 'frontend/base.html' %}
{% load static %}
{% block title %}Activity Log{% endblock %}
{% block content %}

<div class="mb-3">
  <h2 class="fw-bold mb-0">Activity Log</h2>
  <p class="text-secondary mb-0">Audit trail of every create, update, delete and restore action.</p>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead><tr><th>Time</th><th>Action</th><th>Model</th><th>Record</th><th>Details</th></tr></thead>
      <tbody id="logTbody">
        <tr><td colspan="5"><div class="spinner-overlay"><div class="spinner-border text-primary"></div></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="d-flex justify-content-between align-items-center mt-3">
  <div class="small text-secondary" id="resultsSummary"></div>
  <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
</div>

{% endblock %}
{% block extra_scripts %}
<script src="{% static 'frontend/js/activity_log.js' %}"></script>
{% endblock %}
