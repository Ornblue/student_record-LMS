{% extends 'frontend/base.html' %}
{% load static %}
{% block title %}Courses{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <div>
    <h2 class="fw-bold mb-0">Courses</h2>
    <p class="text-secondary mb-0">Manage course offerings and seat capacity.</p>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-outline-secondary" id="exportBtn"><i class="bi bi-download"></i> Export CSV</button>
    <button class="btn btn-primary" id="addCourseBtn"><i class="bi bi-plus-lg"></i> Add Course</button>
  </div>
</div>

<div class="card p-3 mb-3">
  <div class="row g-2 align-items-end">
    <div class="col-md-4">
      <label class="form-label small mb-1">Search</label>
      <input type="text" id="searchInput" class="form-control" placeholder="Code, title, or instructor…">
    </div>
    <div class="col-md-3">
      <label class="form-label small mb-1">Department</label>
      <input type="text" id="deptFilter" class="form-control" placeholder="e.g. Mathematics">
    </div>
    <div class="col-md-3">
      <label class="form-label small mb-1">Seats</label>
      <select id="seatsFilter" class="form-select">
        <option value="">All</option>
        <option value="false">Has open seats</option>
        <option value="true">Full</option>
      </select>
    </div>
    <div class="col-md-2">
      <button class="btn btn-outline-secondary w-100" id="clearFiltersBtn" title="Clear filters"><i class="bi bi-x-lg"></i></button>
    </div>
  </div>
</div>

<div class="row g-3" id="coursesGrid">
  <div class="col-12"><div class="spinner-overlay"><div class="spinner-border text-primary"></div></div></div>
</div>

<div class="d-flex justify-content-between align-items-center mt-3">
  <div class="small text-secondary" id="resultsSummary"></div>
  <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
</div>

<!-- Add / Edit Course Modal -->
<div class="modal fade" id="courseModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="courseForm">
        <div class="modal-header">
          <h5 class="modal-title" id="courseModalTitle">Add Course</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="formErrors" class="alert alert-danger d-none"></div>
          <input type="hidden" id="coursePk">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Course Code *</label>
              <input required class="form-control" id="f_course_code" placeholder="CS101">
            </div>
            <div class="col-md-8">
              <label class="form-label">Title *</label>
              <input required class="form-control" id="f_title">
            </div>
            <div class="col-md-4">
              <label class="form-label">Credits *</label>
              <input required type="number" min="1" max="10" class="form-control" id="f_credits">
            </div>
            <div class="col-md-4">
              <label class="form-label">Capacity *</label>
              <input required type="number" min="1" class="form-control" id="f_capacity">
            </div>
            <div class="col-md-4 form-check mt-4 ms-1">
              <input class="form-check-input" type="checkbox" id="f_is_active" checked>
              <label class="form-check-label" for="f_is_active">Active</label>
            </div>
            <div class="col-md-6">
              <label class="form-label">Department</label>
              <input class="form-control" id="f_department">
            </div>
            <div class="col-md-6">
              <label class="form-label">Instructor</label>
              <input class="form-control" id="f_instructor">
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="f_description" rows="3"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="courseFormSubmit">Save Course</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Roster Modal -->
<div class="modal fade" id="rosterModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="rosterModalTitle">Course Roster</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="rosterBody">
        <div class="spinner-overlay"><div class="spinner-border text-primary"></div></div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
{% block extra_scripts %}
<script src="{% static 'frontend/js/courses.js' %}"></script>
{% endblock %}
